<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account to manage products.">
  <title>Register - CatalogHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="narrow">
      <div class="panel">
        <h1>Create your account</h1>
        <p class="form-hint">Registered users can add, edit and delete products.</p>

        <div id="form-alert" class="alert alert-error" role="alert" hidden></div>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required minlength="2" maxlength="50" autocomplete="name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" maxlength="72" autocomplete="new-password">
            <span class="form-hint">At least 6 characters.</span>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" maxlength="72" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="footer-year"></span> CatalogHub &middot; Product Catalog Management System</div>
  </footer>

  <div id="toast-container" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
