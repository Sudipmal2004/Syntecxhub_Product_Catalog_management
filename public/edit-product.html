<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edit an existing product.">
  <title>Edit Product - CatalogHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="edit">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="medium">
      <div class="page-header">
        <div>
          <h1>Edit product</h1>
          <p>Change the details and save.</p>
        </div>
      </div>

      <div id="form-alert" class="alert alert-error" role="alert" hidden></div>

      <!-- Shown while the product loads -->
      <div id="edit-loading">
        <div class="loading-box" role="status"><div class="spinner"></div><span>Loading product...</span></div>
      </div>

      <form id="product-form" class="panel" hidden>
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="name">Product name</label>
            <input type="text" id="name" name="name" required minlength="2" maxlength="100">
          </div>

          <div class="form-group span-2">
            <label for="description">Description</label>
            <textarea id="description" name="description" required maxlength="1000"></textarea>
          </div>

          <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" name="price" required min="0" step="0.01">
          </div>

          <div class="form-group">
            <label for="stock">Stock quantity</label>
            <input type="number" id="stock" name="stock" required min="0" step="1">
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" required maxlength="50" list="category-list" autocomplete="off">
            <datalist id="category-list"></datalist>
          </div>

          <div class="form-group">
            <label for="brand">Brand</label>
            <input type="text" id="brand" name="brand" required maxlength="50" list="brand-list" autocomplete="off">
            <datalist id="brand-list"></datalist>
          </div>

          <div class="form-group span-2">
            <label for="imageUrl">Image URL (optional)</label>
            <input type="url" id="imageUrl" name="imageUrl" placeholder="https://example.com/photo.jpg">
            <span class="form-hint">Paste a link that starts with http:// or https://</span>
          </div>

          <div class="form-group span-2">
            <img id="image-preview" class="image-preview" alt="Image preview">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save changes</button>
          <a class="btn btn-outline" id="cancel-link" href="index.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="footer-year"></span> CatalogHub &middot; Product Catalog Management System</div>
  </footer>

  <div id="toast-container" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
