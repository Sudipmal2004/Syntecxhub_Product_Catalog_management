<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to manage products.">
  <title>Login - CatalogHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="narrow">
      <div class="panel">
        <h1>Welcome back</h1>
        <p class="form-hint">Log in to add, edit and delete products.</p>

        <div id="form-alert" class="alert alert-error" role="alert" hidden></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="footer-year"></span> CatalogHub &middot; Product Catalog Management System</div>
  </footer>

  <div id="toast-container" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
