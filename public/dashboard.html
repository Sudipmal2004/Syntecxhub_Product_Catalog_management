<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product statistics and category insights.">
  <title>Dashboard - CatalogHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Dashboard</h1>
          <p>Live statistics calculated by MongoDB aggregation.</p>
        </div>
      </div>

      <div id="dashboard-alert" class="alert alert-error" role="alert" hidden></div>

      <!-- Summary cards -->
      <div id="summary-stats"></div>

      <!-- Category charts and table (shown after the data loads) -->
      <div id="dashboard-content" hidden>
        <div class="dashboard-columns">
          <section class="panel" aria-labelledby="count-title">
            <h2 id="count-title">Products per category</h2>
            <div id="count-bars"></div>
          </section>
          <section class="panel" aria-labelledby="price-title">
            <h2 id="price-title">Average price per category</h2>
            <div id="price-bars"></div>
          </section>
        </div>

        <section class="panel" style="margin-top:1.5rem" aria-labelledby="table-title">
          <h2 id="table-title">Category statistics</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Category</th>
                  <th scope="col" class="num">Products</th>
                  <th scope="col" class="num">Avg. price</th>
                  <th scope="col" class="num">Lowest price</th>
                  <th scope="col" class="num">Highest price</th>
                  <th scope="col" class="num">Total stock</th>
                </tr>
              </thead>
              <tbody id="category-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="footer-year"></span> CatalogHub &middot; Product Catalog Management System</div>
  </footer>

  <div id="toast-container" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
